services:
  app:
    build: .
    restart: unless-stopped
    # Bound to localhost: put a TLS-terminating reverse proxy in front.
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: "file:/data/deposits.db"
      SESSION_SECRET: "${SESSION_SECRET:?set SESSION_SECRET in .env}"
      BUSINESS_TZ: "${BUSINESS_TZ:-America/Vancouver}"
      TZ: "${BUSINESS_TZ:-America/Vancouver}"
      BACKUP_DIR: "/data/backups"
      BACKUP_KEEP: "30"
      BACKUP_INTERVAL_HOURS: "6"
      # Mirrored onto the host, so losing the container or its volume does not
      # lose the book. Point BACKUP_MIRROR_HOST_DIR at a synced or backed-up
      # folder for a copy that survives losing the machine too.
      BACKUP_MIRROR_DIR: "/mirror"
    volumes:
      - deposits:/data
      - ${BACKUP_MIRROR_HOST_DIR:-./backups}:/mirror

volumes:
  deposits:
